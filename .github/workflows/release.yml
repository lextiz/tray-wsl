name: Test and release
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Test
        run: |
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 4.10.1
          $result = Invoke-Pester -Script tests/*.Tests.ps1 -PassThru
          if ($result.FailedCount) { throw 'Regression tests failed' }
          ./tests/tray-wsl.Smoke.ps1
          ./tests/install.Smoke.ps1
      - name: Package
        run: ./scripts/package.ps1
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG dist/install.ps1 dist/tray-wsl.zip dist/SHA256SUMS --verify-tag --title "tray-wsl $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
